<!doctype html> 
<html> 
    <head> 
        <meta charset="utf-8" />
        <title>Vault demo</title>
    </head>

    <body>
        <h1>Vault demo</h1>
        <button id="getStatus">Get vault status</button>
        <button id="getSecret">Get secret</button>
        <button id="getInfo">Get information</button>
        <pre id="result"></pre>
        <script>
            // Get information knop
            document.getElementById('getInfo').addEventListener('click', async () => {
            try {
                const r = await fetch('/info');
                const j = await r.json();
                document.getElementById('result').textContent = JSON.stringify(j, null, 2);
            } catch (e) {
                document.getElementById('result').textContent = 'Fout: ' + e.message;
            }
            });

            // Get status knop
            document.getElementById('getStatus').addEventListener('click', async () => {
            try {
                const r = await fetch('/status');
                const j = await r.json();
                document.getElementById('result').textContent = JSON.stringify(j, null, 2);
            } catch (e) {
                document.getElementById('result').textContent = 'Fout: ' + e.message;
            }
            });

            // Get secret knop
            document.getElementById('getSecret').addEventListener('click', async () => {
            try {
                const r = await fetch('/vault');
                const j = await r.text();
                document.getElementById('result').textContent = j;
            } catch (e) {
                document.getElementById('result').textContent = 'Fout: ' + e.message;
            }
            });
        </script>
    </body>
</html>
